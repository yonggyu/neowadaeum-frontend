<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>너와다음</title>

    <!--
      브랜드 자산 (#137, design-gaps E-3).

      아래 문구는 **`F-4` 의 대상이 아니다.** F-4 가 금지하는 것은 *서버가 준 오류*를 프론트가
      제 문장으로 바꿔 쓰는 일이고, 여기 있는 것은 오류 문구가 아니라 **소유자가 확정한 서비스
      소개**다. 그 구분을 적어 두지 않으면 다음 사람이 이 자리를 F-4 위반으로 읽는다.

      로고를 새로 그리지 않는다. favicon 은 헤더의 텍스트 마크(`src/shell/AppShell.tsx` 의
      `.brand`)와 **같은 것을 말한다** — 근거는 `public/favicon.svg` 안에 적었다.
    -->
    <meta
      name="description"
      content="선택으로 이야기를 이끄는 AI 인터랙티브 스토리. 당신이 고른 다음이 이야기가 됩니다."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      글자체 둘 (#136). 이름과 폴백 스택은 `src/styles/tokens.css` 가 갖고, **받아 오는 것은
      여기서만 한다** — `@import` 로 두면 렌더 차단이 한 단계 늘어난다. `display=swap` · 굵기를
      이만큼만 고른 근거 · 구글이 응답하지 않을 때 무엇이 화면을 세우는지는 그 파일에 적었다.

      **주석은 빌드 산출물에 그대로 실린다** (CSS 주석과 달리 지워지지 않는다). 그래서 근거는
      `tokens.css` 에 두고 여기에는 어디를 보라는 것만 남긴다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@400;600;700&amp;display=swap"
    />

    <!--
      OG — **절대 주소가 필요 없는 것만 여기 둔다.**

      `og:url` · `og:image` 는 규격이 절대 주소를 요구하는데 운영 도메인은 이 레포에 적지
      않는다 (S-11). 아래 셋은 그 값과 무관하므로 언제나 나간다: 오리진을 모르는 빌드에서도
      제목과 소개는 뜬다.

      **그 둘은 아래 표시자 자리에 온다** (#188, ADR-0012). `/config.js` 로는 닿지 않는 값이다 —
      **스크레이퍼는 JS 를 돌리지 않는다.** 그래서 컨테이너 진입점이 `PUBLIC_ORIGIN` 을 받아
      **이 마크업에 직접 써 넣는다.** `npm run dev` 에서는 `vite.config.ts` 가 같은 자리를 같은
      모양으로 채운다 — dev 와 배포가 다른 길을 걷지 않게 하려는 것이다.

      **값이 없으면 표시자는 표시자로 남고 두 태그는 나가지 않는다.** 기본값을 지어내지 않는
      이유는 `vite.config.ts` 에 적었다 — 없는 주소를 가리키는 `og:image` 는 카드가 깨진 채로
      남고, 그 상태는 태그가 아예 없는 것보다 알아채기 어렵다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="너와다음" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="너와다음" />
    <meta
      property="og:description"
      content="선택으로 이야기를 이끄는 AI 인터랙티브 스토리. 당신이 고른 다음이 이야기가 됩니다."
    />
    <!--__OG_ABSOLUTE__-->
  </head>
  <body>
    <div id="root"></div>
    <!--
      설정은 `/config.js` 가 준다 (#188, ADR-0012). **그 태그를 여기 적지 않는다** —
      `vite.config.ts` 의 `runtimeConfigScript` 가 `<head>` 맨 앞에 넣는다. 아래 모듈보다
      **먼저** 실행돼야 하고(모듈 평가 중에 `src/api/config.ts` 가 그 값을 읽는다), 여기 적으면
      Vite 가 그것을 번들 입력으로 보려 한다 — 그 파일은 빌드 산출물이 아니라 **컨테이너가 뜰 때
      생기는 것**이므로 빌드 시점에는 존재하지 않는다.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
