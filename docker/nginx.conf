# ─────────────────────────────────────────────────────────────
# 정적 서빙 (#187)
#
# **이 nginx 는 `/api` 를 프록시하지 않는다.** 단일 오리진(`/` 프론트 · `/api` 백엔드)은
# **앞단** 리버스 프록시가 만든다 — 리프레시 쿠키가 `SameSite=Strict` 로 하드코딩돼 있어
# 그 배치 외에는 로그인 유지가 성립하지 않는다 (백엔드 ADR-0008). 여기서 프록시를 붙이면
# 그 결정이 두 곳에 흩어지고, 어느 쪽이 진짜 경계인지가 매번 문제가 된다.
#
# `F-8` 과 헷갈리지 않게 적어 둔다 — 금지된 것은 *개발 서버 프록시로 CORS 를 우회하는 것*이고,
# 운영 앞단 프록시는 그 반대로 **요구되는** 배치다. 그 자리가 이 파일이 아닐 뿐이다.
#
# gzip · TLS · HSTS 도 여기 두지 않는다. 같은 이유다.
# ─────────────────────────────────────────────────────────────

server {
    # unprivileged 이미지의 기본 포트. root 가 아니면 80 을 열 수 없다.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 설정 (#188, ADR-0012) ────────────────────────────────
    #
    # **캐시하면 안 된다.** 이 파일이 값을 나르므로, 캐시되면 값을 바꾸고 컨테이너를 갈아
    # 끼워도 브라우저가 옛 오리진을 계속 부른다. 이름에 해시가 붙지 않는 것도 이 파일뿐이다.
    #
    # **아래 SPA fallback 이 이 자리를 삼키면 안 된다.** 파일이 없을 때 `index.html` 을
    # 돌려주면 브라우저가 HTML 을 JS 로 파싱하다 실패하고, **값이 빠진 것이 문법 오류로**
    # 나타난다. 없으면 404 여야 원인이 그대로 보인다.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # 진입 문서도 캐시하지 않는다. 자산 이름(해시)이 여기 적혀 있으므로 이것이 낡으면
    # 새 자산이 있어도 옛것을 부른다.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # 해시가 붙은 자산은 **내용이 바뀌면 이름이 바뀐다.** 그래서 오래 잡아 둔다.
    # 여기서도 fallback 을 막는다 — 없는 자산에 HTML 을 돌려주면 같은 종류의 거짓말이 된다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA. 라우팅은 브라우저가 한다 — 새로고침이나 공유 링크로 들어온 경로도 `index.html` 이 받는다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
