# ─────────────────────────────────────────────────────────────
# 이미지 빌드·검증·게시 (#187)
#
# **이 워크플로의 핵심은 게시가 아니라 검증이다.** 이미지는 레지스트리에 남고 어디로든
# 복사된다 — 한 번 들어간 값은 나중에 지워도 레이어에 남는다. 그래서 게시 전에 **이미지 안에
# 설정이 없다는 것을 실제로 확인한다** (백엔드 S-2 와 같은 자리).
#
# 백엔드의 같은 파일과 **같은 모양으로 둔다.** 두 레포가 같은 구조를 갖는 것이 이 프로젝트의
# 관례이고, 갈라지면 두 곳의 동작을 각각 기억해야 한다. 확인하는 **내용**은 다르다 —
# 백엔드는 설정 파일이 템플릿 그대로인지 보고, 프론트는 **번들에 값이 박히지 않았는지** 본다.
#
# ※ 시크릿을 넣지 않는다. 내장 GITHUB_TOKEN 외의 자격 증명을 쓰지 않는다 — GHCR 을 고른
#    이유가 이것이다.
# ─────────────────────────────────────────────────────────────
name: Release

on:
  # **태그가 곧 릴리스다. 브랜치 머지가 배포를 부르지 않는다** — 언제 나가는지는 사람이 정한다.
  # 백엔드가 정한 것을 프론트도 그대로 따른다. `main` 머지 자동배포는 검토했고 택하지 않았다:
  # 실질 차이는 명령 한 줄인데 잃는 것은 **롤백 좌표**다.
  push:
    tags: ["v*"]
  workflow_dispatch:
  # 이미지를 만드는 것들이 바뀌면 **머지 전에** 확인한다. 게시는 하지 않는다.
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - ".github/workflows/release.yml"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # 진입점이 이 이름들을 요구한다 (docker/40-neowadaeum-config.sh). 아래 확인에서만 쓰는
  # **명백히 가짜인** 값이다 — `.invalid` 는 RFC 2606 이 예약해 둔 TLD 라 이름이 절대 풀리지
  # 않는다. 운영 값은 이 레포 어디에도 적지 않는다 (S-11).
  CHECK_API_BASE_URL: "http://api.invalid"
  CHECK_GOOGLE_OAUTH_CLIENT_ID: "check.apps.googleusercontent.invalid"
  CHECK_PUBLIC_ORIGIN: "https://app.invalid"

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # 게시할 때만 쓴다. PR 실행에서는 로그인하지 않는다.
      packages: write
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 계약은 이 레포에 없다. `ci.yml` 과 **같은 방식·같은 자리**로 받는다 — `ref: backend`
      # 를 명시하는 이유(비워 두면 낡은 계약에 고정된다, #32)는 거기에 적혀 있다.
      #
      # **빌드 스테이지가 직접 받지 않는다.** 그러면 이미지 빌드가 네트워크와 토큰을 알게 된다.
      - name: 계약 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yonggyu/neowadaeum-backend
          ref: backend
          path: _contract
          persist-credentials: false

      - name: 이미지 빌드
        run: docker build --tag "$IMAGE:${GITHUB_SHA}" .

      # ── S-2 검증 ─────────────────────────────────────────────
      # 파일 목록을 눈으로 확인하는 절차는 반드시 빠진다. 여기서 실패시킨다.
      - name: 이미지에 설정이 없는지 확인
        run: |
          set -euo pipefail
          container="$(docker create "$IMAGE:${GITHUB_SHA}")"
          trap 'docker rm -f "$container" > /dev/null' EXIT
          docker export "$container" | tar -tf - > /tmp/image-files.txt

          # **`.env` 는 이미지 어디에도 있으면 안 된다.** 베이스 이미지가 만들 이유가 없는
          # 이름이므로, 나오면 그것은 우리가 넣은 것이다.
          if grep -Eq '(^|/)\.env($|\.)' /tmp/image-files.txt; then
            echo "이미지에 .env 가 있다:"
            grep -E '(^|/)\.env($|\.)' /tmp/image-files.txt
            exit 1
          fi

          # **`config.js` 가 이미지에 있으면 안 된다.** 그 파일은 컨테이너가 뜰 때 진입점이
          # 만드는 것이고(ADR-0012), 이미지에 들어 있다면 값이 빌드 시점에 박혔다는 뜻이다.
          if grep -Eq 'usr/share/nginx/(html|template)/config\.js$' /tmp/image-files.txt; then
            echo "이미지에 config.js 가 들어 있다 — 값이 빌드에 박혔다."
            exit 1
          fi

      - name: 번들에 설정이 박히지 않았는지 확인
        run: |
          set -euo pipefail
          # **이것이 프론트판 S-2 다.** 백엔드가 "설정이 템플릿 그대로인가" 를 diff 로 보는
          # 자리에 대응한다. 값을 빌드에 주지 않았으므로 아래 이름들이 남아 있으면 누군가
          # 다시 `import.meta.env` 를 읽게 만든 것이다.
          if docker run --rm --entrypoint sh "$IMAGE:${GITHUB_SHA}" -c \
               'grep -rl "VITE_" /usr/share/nginx/html /usr/share/nginx/template' > /tmp/vite-hits.txt 2>/dev/null; then
            echo "산출물에 VITE_ 로 시작하는 이름이 남아 있다 — 값이 빌드 시점에 읽혔다 (ADR-0012):"
            cat /tmp/vite-hits.txt
            exit 1
          fi

          # **표시자가 원본에 그대로 있어야 한다.** 이것이 없으면 진입점이 채울 자리가 없고,
          # 공유 카드는 **눌러 보기 전까지 조용히** 사라진다.
          docker run --rm --entrypoint sh "$IMAGE:${GITHUB_SHA}" -c \
            'grep -q "__OG_ABSOLUTE__" /usr/share/nginx/template/index.html' ||
            { echo "원본 index.html 에 OG 표시자가 없다 — index.html 과 진입점이 갈라졌다."; exit 1; }

      - name: 설정 없이는 뜨지 않는지 확인
        run: |
          set -euo pipefail
          # **값을 주지 않고 띄운다.** 요구되는 것은 "값이 없으면 기동 실패" 이므로,
          # 여기서 성공하면 그것이 오히려 결함이다 — 어딘가에 기본값이 박혀 있다는 뜻이다.
          #
          # 매달리는 것도 실패로 본다. 값이 없는데 무언가를 기다리고 있다면 그것은
          # "빠르게 실패한다" 가 아니다.
          status=0
          timeout 60 docker run --rm "$IMAGE:${GITHUB_SHA}" > /tmp/boot.log 2>&1 || status=$?
          tail -20 /tmp/boot.log
          case "$status" in
            0)   echo "설정 없이 떴다 — 기본값이 박혀 있다."; exit 1 ;;
            124) echo "설정 없이 기동이 끝나지 않았다 — 실패해야 할 자리에서 기다린다."; exit 1 ;;
            *)   echo "설정 없이는 뜨지 않는다 (exit $status) — 기대한 동작이다." ;;
          esac

      # **성공하는 길도 확인한다.** 백엔드에는 없는 단계다 — 거기서는 "값이 없으면 실패한다"
      # 하나로 충분하지만, 여기서는 진입점이 **파일 둘을 만들어 낸다.** 그것이 실제로 만들어져
      # 서빙되는지 보지 않으면, 뜨기는 뜨는데 흰 화면인 이미지가 게시될 수 있다.
      - name: 설정을 주면 실제로 서빙하는지 확인
        run: |
          set -euo pipefail
          container="$(docker run -d -p 8080:8080 \
            -e API_BASE_URL="$CHECK_API_BASE_URL" \
            -e GOOGLE_OAUTH_CLIENT_ID="$CHECK_GOOGLE_OAUTH_CLIENT_ID" \
            -e PUBLIC_ORIGIN="$CHECK_PUBLIC_ORIGIN" \
            "$IMAGE:${GITHUB_SHA}")"
          trap 'docker logs "$container" 2>&1 | tail -20; docker rm -f "$container" > /dev/null' EXIT

          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/config.js -o /tmp/config.js && break
            sleep 0.5
          done

          # 진입점이 준 값이 그대로 나와야 한다.
          grep -q "$CHECK_API_BASE_URL" /tmp/config.js ||
            { echo "/config.js 에 API_BASE_URL 이 없다:"; cat /tmp/config.js; exit 1; }

          # **캐시되면 안 된다.** 캐시되면 값을 바꾸고 컨테이너를 갈아 끼워도 옛 오리진을 부른다.
          curl -sI http://localhost:8080/config.js | grep -qi 'cache-control: *no-store' ||
            { echo "/config.js 가 no-store 로 나가지 않는다."; exit 1; }

          curl -sf http://localhost:8080/ -o /tmp/index.html
          grep -q "og:url\" content=\"$CHECK_PUBLIC_ORIGIN/\"" /tmp/index.html ||
            { echo "index.html 의 OG 표시자가 채워지지 않았다."; exit 1; }
          # `grep && { exit 1; }` 로 쓰지 않는다 — 표시자가 **없을 때**(정상) grep 이 실패하고,
          # `set -e` 는 AND 리스트의 실패를 그대로 받아 이 단계를 죽인다. 실제로 그렇게 썼다가
          # 옳은 이미지에서 빨간불이 났다.
          if grep -q '__OG_ABSOLUTE__' /tmp/index.html; then
            echo "표시자가 남아 있다 — 치환이 돌지 않았다."
            exit 1
          fi

          # **없는 자산에 HTML 을 돌려주면 안 된다.** 그러면 값이 빠진 것이 문법 오류로 나타난다.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/nope.js)"
          [ "$code" = "404" ] || { echo "없는 자산이 $code 로 답한다 — fallback 이 삼켰다."; exit 1; }

          # SPA 는 라우팅을 브라우저가 한다. 새로고침·공유 링크로 들어온 경로도 문서를 받아야 한다.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/library/x)"
          [ "$code" = "200" ] || { echo "SPA 경로가 $code 로 답한다."; exit 1; }

          echo "설정을 주면 뜨고 서빙한다 — 기대한 동작이다."

      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 게시
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # **이동 가능한 태그를 만들지 않는다.** 롤백은 "이전 SHA 로 되돌린다" 여야 하고,
          # latest 가 있으면 무엇으로 되돌리는지가 흐려진다.
          docker push "$IMAGE:${GITHUB_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag "$IMAGE:${GITHUB_SHA}" "$IMAGE:${GITHUB_REF_NAME}"
            docker push "$IMAGE:${GITHUB_REF_NAME}"
          fi
