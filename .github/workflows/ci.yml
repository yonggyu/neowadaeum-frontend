# ─────────────────────────────────────────────────────────────
# CI 파이프라인
#
# 잡은 정확히 3개이며 이름이 곧 브랜치 보호의 필수 status check 이름이다.
# 백엔드 레포와 같은 이름을 쓴다 — 두 레포의 보호 설정을 한 규칙으로 읽기 위해서다.
# 이름을 바꾸면 세 브랜치의 보호 설정이 조용히 헐거워진다.
#
# ※ 시크릿을 넣지 않는다. 내장 GITHUB_TOKEN 외의 자격 증명을 쓰지 않는다.
# ─────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    branches: [frontend, dev, main]
  push:
    branches: [frontend]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # 빌드와 테스트가 설정을 요구한다 — src/api/config.ts 가 값이 없으면 던진다.
  # CI 가 만드는 번들은 배포물이 아니므로 로컬 주소로 충분하다. 운영 오리진은
  # 이 레포 어디에도 적지 않는다.
  VITE_API_BASE_URL: "http://localhost:8080"
  # 계약은 이 레포에 없다. CI 가 백엔드를 워크스페이스 안으로 받아 여기서 타입을 만든다.
  # actions/checkout 은 워크스페이스 밖(`../`)에 체크아웃하지 못하므로 로컬의 형제 경로를
  # 그대로 쓸 수 없다 — 그래서 package.json 의 OPENAPI_SOURCE 로 가리킨다.
  OPENAPI_SOURCE: "_contract/docs/openapi.yaml"
  # 이동 가능한 태그를 쓰지 않는다는 관례를 바이너리에도 적용한다.
  # 체크섬은 릴리스의 gitleaks_<버전>_checksums.txt 에 게시된 값이다.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 공개 레포다 — 내장 GITHUB_TOKEN 으로 충분하고 별도 자격 증명을 쓰지 않는다.
      #
      # `ref: backend` 를 **명시한다.** 여기를 비우면 `actions/checkout` 이 기본 브랜치(`main`)를
      # 주는데, 백엔드의 `main` 은 계약이 실제로 사는 `backend` 보다 한참 뒤에 있다 (#32).
      # 비워 두는 것이 "최신을 따라간다" 는 뜻이 아니었다 — **낡은 계약에 고정된다**는 뜻이었고,
      # 프론트 CI 가 초록이었던 것도 어긋난 것을 못 봤기 때문이다.
      #
      # 여전히 커밋으로 고정하지는 않는다: 계약이 바뀌면 여기서 빨간불이 나야 한다.
      # 프론트가 오래된 계약 위에서 조용히 초록인 것보다, 어긋난 순간 멈추는 편이 싸다.
      # 백엔드가 `backend → dev → main` 을 승격하면 이 값을 되돌릴지 다시 판단한다.
      - name: 계약 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yonggyu/neowadaeum-backend
          ref: backend
          path: _contract
          persist-credentials: false

      - name: Node 준비
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # lockfile 이 캐시 키다. 없을 때는 켤 수 없었다.
          cache: npm

      # npm ci 다. lockfile 과 package.json 이 어긋나면 **실패한다** — 누군가 package.json 만
      # 고치고 lockfile 을 안 올리면 여기서 잡힌다. npm install 은 그것을 조용히 맞춰 버린다.
      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      # F-2 — API 타입을 손으로 적지 않는다. 산출물이라 커밋하지 않으므로 여기서 만든다.
      - name: 계약 → 타입
        run: npm run api:types

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 빌드
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 공개 레포다 — 내장 GITHUB_TOKEN 으로 충분하고 별도 자격 증명을 쓰지 않는다.
      #
      # `ref: backend` 를 **명시한다.** 여기를 비우면 `actions/checkout` 이 기본 브랜치(`main`)를
      # 주는데, 백엔드의 `main` 은 계약이 실제로 사는 `backend` 보다 한참 뒤에 있다 (#32).
      # 비워 두는 것이 "최신을 따라간다" 는 뜻이 아니었다 — **낡은 계약에 고정된다**는 뜻이었고,
      # 프론트 CI 가 초록이었던 것도 어긋난 것을 못 봤기 때문이다.
      #
      # 여전히 커밋으로 고정하지는 않는다: 계약이 바뀌면 여기서 빨간불이 나야 한다.
      # 프론트가 오래된 계약 위에서 조용히 초록인 것보다, 어긋난 순간 멈추는 편이 싸다.
      # 백엔드가 `backend → dev → main` 을 승격하면 이 값을 되돌릴지 다시 판단한다.
      - name: 계약 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yonggyu/neowadaeum-backend
          ref: backend
          path: _contract
          persist-credentials: false

      - name: Node 준비
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # lockfile 이 캐시 키다. 없을 때는 켤 수 없었다.
          cache: npm

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      # F-2 — API 타입을 손으로 적지 않는다. 산출물이라 커밋하지 않으므로 여기서 만든다.
      - name: 계약 → 타입
        run: npm run api:types

      - name: 테스트
        run: npm test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 전체 이력을 봐야 한다. 얕은 클론이면 과거 커밋의 유출을 못 본다.
      # 어느 브랜치에 있든 유출은 유출이다 — 공개 레포에서는 브랜치도 공개다.
      - name: 체크아웃 (전체 이력)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 액션 대신 바이너리를 직접 받는다. 버전·체크섬을 우리가 고정한다.
      - name: gitleaks 설치
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      # --redact 는 생략하지 않는다. 탐지된 값이 로그에 찍히면 공개 레포의 실행 로그가
      # 두 번째 유출 경로가 된다.
      - name: 전체 이력 스캔
        run: /tmp/gitleaks git . --redact --no-banner --verbose
