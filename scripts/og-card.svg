<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    OG 카드의 **원본**이다. 배포되는 것은 이것을 래스터화한 `public/og-card.png` 이며,
    이 파일 자신은 `public/` 밖에 있으므로 서비스되지 않는다 — 카카오톡 · 슬랙 · X 의
    미리보기 스크레이퍼가 `image/svg+xml` 을 읽지 않기 때문에 SVG 를 그대로 낼 수 없다.

    PNG 를 손으로 고치지 말고 이 파일을 고친 뒤 다시 뽑는다. 브라우저 하나면 된다:

      <크롬 실행 파일> --headless=new --disable-gpu --hide-scrollbars \
        --force-device-scale-factor=1 --window-size=1200,630 \
        --screenshot=public/og-card.png file://<절대경로>/scripts/og-card.svg

    래스터화 도구를 의존성으로 들이지 않는다. 이 카드는 문구가 바뀔 때만 다시 뽑으면 되고,
    그 빈도로는 빌드에 단계를 더하는 값이 더 비싸다. (macOS 의 `qlmanage` 는 쓰지 않는다 —
    썸네일 캔버스를 정사각으로 잡아 1200x630 이 나오지 않는다.)

    동적 생성(서버 · 엣지 함수)을 두지 않는다 (#137). 이 레포에 그런 실행 자리가 없고,
    만들면 배포 결정이 따라온다 — 지금 필요한 것은 카드 하나다.

    글자와 색을 새로 정하지 않는다. 마크는 헤더의 텍스트 표기 그대로이고, 색은
    `src/styles/tokens.css` 의 뉴트럴(`bg` #ffffff · `fg` #1a1a1a · `fg-muted`)이다.
    팔레트는 #135 의 것이다.
  -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect x="0" y="0" width="1200" height="12" fill="#1a1a1a" />
  <g font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">
    <text x="600" y="300" fill="#1a1a1a" font-size="132" font-weight="700">너와다음</text>
    <text x="600" y="386" fill="rgba(0,0,0,0.55)" font-size="38" font-weight="400">선택으로 이야기를 이끄는 AI 인터랙티브 스토리</text>
    <text x="600" y="446" fill="rgba(0,0,0,0.55)" font-size="38" font-weight="400">당신이 고른 다음이 이야기가 됩니다</text>
  </g>
</svg>
