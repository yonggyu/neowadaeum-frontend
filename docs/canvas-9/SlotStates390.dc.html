<!doctype html>
<html>

<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; font-family: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif; font-size: 14px; color: #1a1a1a; background: #faf8f4; }
    * { box-sizing: border-box; }
    p, h1, h2, h3 { margin: 0; }
    a { color: #2b6ca8; } a:hover { color: #1f5178; }
    ul { margin: 0; padding: 0; list-style: none; }
  </style>

<div style="min-height: 100%; padding: 24px 16px; background: #faf8f4;">
  <h1 style="font-family: 'Noto Serif KR', serif; font-size: 20px; line-height: 1.3; font-weight: 600;">390 — 새 상태 둘</h1>
  <p style="margin-top: 8px; color: rgba(0,0,0,.55); font-size: 14px; line-height: 1.7;">좁은 폭에서도 자리는 96px 그대로다. 바뀌는 것은 버튼이 아래로 내려가 <strong style="color:#1a1a1a; font-weight:600;">전폭</strong>이 되는 것뿐.</p>

  <div style="display: flex; flex-direction: column; gap: 24px; margin-top: 24px;">
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid rgba(0,0,0,.12); border-radius: 16px; background: #f0eee9;">
      <p style="font-size: 13px; font-weight: 600;">⑤-a 받는 중</p>
      <div style="display: flex; gap: 16px; align-items: center;"><div style="display: flex; position: relative; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 96px; aspect-ratio: 2 / 3; overflow: hidden; padding: 8px; border: 1px dashed rgba(0,0,0,.12); border-radius: 12px; background: #f0eee9;"><div style="position: absolute; inset: 0; background: #e4dfd5;"></div><div style="position: absolute; inset: 0; background: linear-gradient(100deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 70%);"></div></div>
        <p style="color: rgba(0,0,0,.55); font-size: 12px; line-height: 1.4; text-align: left;">칸을 늘리지 않는다.<br>그림 자리만 비운다.</p>
      </div>
      <div style="display: flex; gap: 8px;">
        <button type="button" style="min-height: 48px; padding: 0 16px; border: 1px solid rgba(0,0,0,.12); border-radius: 12px; background: #faf8f4; color: #1a1a1a; font: inherit; font-size: 13px; cursor: pointer; flex: 1 1 0;">교체</button>
        <button type="button" style="min-height: 48px; padding: 0 16px; border: 1px solid rgba(0,0,0,.12); border-radius: 12px; background: #faf8f4; color: #1a1a1a; font: inherit; font-size: 13px; cursor: pointer; flex: 1 1 0;">제거</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 2px solid #1a1a1a; border-radius: 16px; background: #faf8f4;">
      <p style="font-size: 13px; font-weight: 600;">⑤-b 못 받음</p>
      <div style="display: flex; gap: 16px; align-items: center;"><div style="display: flex; position: relative; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 96px; aspect-ratio: 2 / 3; overflow: hidden; padding: 8px; border: 1px dashed rgba(0,0,0,.12); border-radius: 12px; background: #f0eee9;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.38)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M4 20L20 4"></path></svg><p style="color: rgba(0,0,0,.55); font-size: 12px; line-height: 1.4; text-align: center;">이미지를 불러오지 못했어요</p></div>
        <p style="color: rgba(0,0,0,.55); font-size: 12px; line-height: 1.4; text-align: left;">④ 의 빨강을 쓰지 않는다.<br>올린 것은 그대로 있다.</p>
      </div>
      <button type="button" style="min-height: 48px; padding: 0 16px; border: 1px solid rgba(0,0,0,.12); border-radius: 12px; background: #faf8f4; color: #1a1a1a; font: inherit; font-size: 13px; cursor: pointer; width: 100%;">다시 불러오기</button>
    </div>
  </div>
</div></x-dc>
</body>
</html>
