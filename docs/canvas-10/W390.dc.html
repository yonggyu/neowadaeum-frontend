<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

  <style>

    a { color: #2b6ca8; } a:hover { color: #1f5180; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #faf8f4; color: #1a1a1a; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; border-bottom: 1px solid rgba(0,0,0,.12); box-sizing: border-box">

  </div>

  <div style="padding: 24px 16px 0">
    <div style="font-family: 'Noto Serif KR', serif; font-size: 24px; line-height: 1.4; margin: 0 0 24px">당신의 선택이 다음 이야기를 만든다.</div>
    <div style="font-size: 14px; line-height: 1.6; color: rgba(0,0,0,.55)">읽고, 고르고, 이어지는 인터랙티브 스토리.</div>
    <div style="display: flex; gap: 12px; margin-top: 32px; padding: 12px 0">
      <div style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; min-height: 56px; border: 1px solid #1a1a1a; border-radius: 12px; background: #1a1a1a; color: #faf8f4; font-size: 14px; font-weight: 500">이야기 시작하기</div>
      <div style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; min-height: 56px; border: 1px solid #1a1a1a; border-radius: 12px; background: #faf8f4; color: #1a1a1a; font-size: 14px; font-weight: 500">작품 둘러보기</div>
    </div>
    <div style="margin-top: 48px; width: 358px; height: 448px; background: #f0eee9; border-radius: 12px"></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 64px; align-items: center; border-top: 1px solid rgba(0,0,0,.12); background: #faf8f4; font-size: 14px; color: rgba(0,0,0,.55); text-align: center">
    <div>Library</div><div>My Stories</div><div>계정</div>
  </div>

  <div style="position: absolute; left: 16px; bottom: 76px; width: 340px; padding: 12px; background: #faf8f4; border: 1px solid rgba(0,0,0,.12); border-radius: 12px">
    <div style="font-size: 12px; line-height: 1.6; color: rgba(0,0,0,.55)"><span style="font-weight: 700; color: #1a1a1a">390 × 844</span> — 제목이 두 줄이 된다. CTA 는 sticky 지만 자기 <span style="font-family: ui-monospace, Menlo, monospace">section</span> 의 마지막 자식이라 붙을 자리가 없어 흐름 그대로 선다 (지금도 그렇다). 히어로는 4:5 로 아래에 온다.</div>
  </div>

</div>
</x-dc>

</html>
